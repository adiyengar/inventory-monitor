# Main Configuration File
project:
  name: "Inventory Monitoring System"
  version: "1.0.0"
  timezone: "America/Chicago"

# Video source configuration
video:
  watch_directory: "data/videos"
  roi_frame_size: [1080, 1920]  # videos must match this frame size or they're skipped as a mismatch
  # Naming convention: partitionID_YYYYMMDD_HHMMSS.<ext>
  # Example: partition_screws_20260409_143000.mp4
  filename_pattern: "*_*.*"
  video_extensions: ["mp4", "mov"]  # case-insensitive
  process_order: "timestamp"
  archive_processed: true
  archive_directory: "data/processed"
  save_annotated_video: true
  output_directory: "data/outputs/videos"
  skip_frames: 5         # Process every 5th frame for speed
  max_video_age_hours: 0 # 0 = no age filter (required for multi-day testing)

# HuggingFace model configuration
model:
  # OWL-ViT: open-vocabulary detector — detects objects by text description.
  # Required here because screws and coins are not in standard COCO classes.
  name: "google/owlvit-base-patch32"
  confidence_threshold: 0.1  # OWL-ViT scores are typically low; 0.05-0.15 works well
  device: "cpu"              # change to "cuda" if you have a GPU

  # Text queries: describe what to look for in plain language.
  # Each drawer's part_type below should be one of these strings.
  text_queries:
    - "nails"
    - "med nails"

# Drawer/partition definitions
# IMPORTANT: Update roi coordinates after recording your first video.
# roi format: [x1, y1, x2, y2]  (pixels, top-left to bottom-right)
#
# Cold-start wizard: draw each partition box on your first video, label it,
# and this whole section (plus model.text_queries) gets rewritten for you:
#   python main.py --setup
#   (or: python scripts/find_roi.py data/videos/<your_first_video>.mp4)
drawers:
  big_nails:
    name: "Big Nails"
    roi: [130, 687, 483, 1131]
    min_threshold: 40
    critical_threshold: 10
    part_type: "nails"

  nails:
    name: "med nails"
    roi: [504, 695, 826, 1108]
    min_threshold: 40
    critical_threshold: 10
    part_type: "med nails"

  3:
    name: "small nails"
    roi: [142, 1172, 476, 1641]
    min_threshold: 40
    critical_threshold: 10
    part_type: "med nails"

  4:
    name: "tiny nails"
    roi: [504, 1170, 855, 1654]
    min_threshold: 40
    critical_threshold: 10
    part_type: "nails"

# Alert configuration
alerts:
  enabled: false   # set to true and configure email below when ready
  methods:
    - log

  email:
    enabled: false
    provider: "sendgrid"
    subject_prefix: "[Inventory Alert]"
    include_images: true

  rules:
    critical:
      threshold_type: "below"
      priority: "high"
      immediate_notification: true
    warning:
      threshold_type: "below"
      priority: "medium"
      immediate_notification: false

  cooldown_minutes: 60

  # End-of-night check: after a --process-all batch, compare each drawer's
  # last recorded count to its first recorded count in that batch. Alert if
  # it has fallen below this fraction of the initial amount.
  depletion_threshold: 0.5

# Report configuration
reports:
  enabled: true
  format: "html"
  recipients:
    - "manager@company.com"

# Database
database:
  enabled: true
  type: "sqlite"
  path: "data/inventory_tracking.db"

# Logging
logging:
  level: "INFO"
  file: "logs/inventory_monitor.log"
  max_bytes: 10485760
  backup_count: 5

# Processing options
processing:
  display_video: false
